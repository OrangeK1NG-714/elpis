version: '3.8'

services:
  # Elpis 应用服务
  elpis-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elpis-tencent
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - NODE_ENV=production
      - _ENV=prod
      # 数据库配置（根据实际情况调整）
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=elpis
      - DB_PASSWORD=elpis_password
      - DB_DATABASE=elpis_db
    depends_on:
      - mysql
    networks:
      - elpis-network
    volumes:
      # 持久化日志
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: elpis-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=elpis_db
      - MYSQL_USER=elpis
      - MYSQL_PASSWORD=elpis_password
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 持久化数据
      - mysql-data:/var/lib/mysql
      # 初始化脚本（如果有）
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - elpis-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

networks:
  elpis-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
